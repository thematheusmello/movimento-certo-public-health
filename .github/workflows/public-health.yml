name: Public health
run-name: ${{ inputs.exercise_alert && 'CONTROLLED alert delivery exercise' || 'Movimento Certo public health' }}

on:
  push:
    branches: [main]
    paths: ['.github/scripts/public-health*.mjs', '.github/workflows/public-health.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      exercise_alert:
        description: 'Controlled notification exercise after the real health checks pass'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify the monitor
        run: node --test .github/scripts/public-health.test.mjs
      - name: Check the public site and dependencies
        run: node .github/scripts/public-health.mjs
      - name: Controlled alert delivery exercise
        if: ${{ inputs.exercise_alert == true }}
        run: |
          echo '::error::CONTROLLED MC-019 notification exercise. Health checks passed; no production outage was induced.'
          exit 1
